<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image Generator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: monospace;
        }
        #canvas {
            border: 2px solid #fff;
            display: block;
            margin: 20px auto;
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 15px 30px;
            font-size: 18px;
            background: #00ffff;
            color: #000;
            border: 3px solid #000;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="1200" height="630"></canvas>
    <button onclick="downloadImage()">Download OG Image</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Background
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, 1200, 630);

        // Scanline effect
        for (let i = 0; i < 630; i += 4) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, i, 1200, 2);
        }

        // Title "TERMINAL → TEXT"
        ctx.font = 'bold 80px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Neon glow effect for title
        ctx.shadowColor = '#ff00ff';
        ctx.shadowBlur = 40;
        ctx.fillStyle = '#ffffff';
        ctx.fillText('TERMINAL', 600, 200);

        // Arrow
        ctx.font = 'bold 60px "Courier New", monospace';
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 30;
        ctx.fillStyle = '#ff00ff';
        ctx.fillText('→', 600, 280);

        // TEXT
        ctx.font = 'bold 80px "Courier New", monospace';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 40;
        ctx.fillStyle = '#ffffff';
        ctx.fillText('TEXT', 600, 360);

        // Subtitle
        ctx.font = 'bold 24px "Courier New", monospace';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#00ffff';
        ctx.fillText('/// TERMINAL OUTPUT CLEANER ///', 600, 460);

        // Version badge
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(950, 50, 180, 60);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.strokeRect(950, 50, 180, 60);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 28px "Courier New", monospace';
        ctx.fillText('v 2.0', 1040, 80);

        // Decorative elements
        // Pink circle
        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#ff00ff';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(120, 120, 60, 0, Math.PI * 2);
        ctx.stroke();

        // Cyan zigzag
        ctx.strokeStyle = '#00ffff';
        ctx.shadowColor = '#00ffff';
        ctx.beginPath();
        ctx.moveTo(80, 500);
        ctx.lineTo(120, 550);
        ctx.lineTo(160, 500);
        ctx.lineTo(200, 550);
        ctx.lineTo(240, 500);
        ctx.stroke();

        // Lime wave
        ctx.strokeStyle = '#39ff14';
        ctx.shadowColor = '#39ff14';
        ctx.beginPath();
        ctx.moveTo(960, 500);
        for (let x = 960; x < 1120; x += 10) {
            const y = 525 + Math.sin((x - 960) * 0.1) * 25;
            ctx.lineTo(x, y);
        }
        ctx.stroke();

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'og-image.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Auto-generate on load
        console.log('OG Image generated! Click the button to download.');
    </script>
</body>
</html>
