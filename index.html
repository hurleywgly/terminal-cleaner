<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal → Text</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Monoton&family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap');
        
        :root {
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-lime: #39ff14;
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            color: #fff;
            font-family: 'Space Mono', monospace;
            overflow-x: hidden;
        }

        .doodle-font { font-family: 'Permanent Marker', cursive; }
        .title-font { font-family: 'Monoton', cursive; }

        /* Neon Flicker Animation */
        @keyframes neon-flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow: 
                    0 0 4px #fff,
                    0 0 10px #fff,
                    0 0 20px var(--neon-pink),
                    0 0 40px var(--neon-pink),
                    0 0 80px var(--neon-pink);
                opacity: 1;
            }
            20%, 24%, 55% {
                text-shadow: none;
                opacity: 0.8;
            }
        }

        @keyframes cyan-pulse {
            0%, 100% {
                text-shadow: 
                    0 0 4px #fff,
                    0 0 10px var(--neon-cyan),
                    0 0 20px var(--neon-cyan);
            }
            50% {
                text-shadow: 
                    0 0 2px #fff,
                    0 0 5px var(--neon-cyan),
                    0 0 10px var(--neon-cyan);
            }
        }

        .neon-title {
            animation: neon-flicker 1.5s infinite alternate;
        }
        
        .neon-subtitle {
            animation: cyan-pulse 2s infinite;
        }

        /* 90s Doodle Aesthetics */
        .neon-border {
            border: 3px solid #fff;
            box-shadow: 
                4px 4px 0px var(--neon-pink),
                -4px -4px 0px var(--neon-cyan);
            transition: all 0.2s ease;
        }

        .neon-border:focus-within {
            box-shadow: 
                6px 6px 0px var(--neon-lime),
                -6px -6px 0px var(--neon-pink);
            transform: scale(1.005);
        }

        .btn-retro {
            background: var(--neon-cyan);
            color: #000;
            border: 3px solid #000;
            font-weight: bold;
            box-shadow: 4px 4px 0px #fff;
            text-shadow: none;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-retro:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--neon-pink);
        }

        .btn-retro:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #fff;
        }

        /* Checkbox styling */
        .toggle-checkbox:checked {
            background-color: var(--neon-lime);
            border-color: #000;
        }
        .toggle-checkbox:checked:after {
            content: '✔';
            display: block;
            color: black;
            font-size: 12px;
            text-align: center;
            line-height: 14px;
        }

        /* Scribble Decor */
        .scribble {
            position: absolute;
            z-index: -1;
            opacity: 0.6;
            pointer-events: none;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #111;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--neon-pink);
            border: 2px solid #000;
        }

        textarea {
            background: rgba(0,0,0,0.8);
            caret-color: var(--neon-lime);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-12 relative">
    <!-- Background Doodles -->
    <svg class="scribble hidden md:block top-10 left-10 w-32 h-32 text-pink-500" viewBox="0 0 100 100">
        <path d="M10,50 Q30,10 50,50 T90,50" fill="none" stroke="currentColor" stroke-width="3" />
    </svg>
    <svg class="scribble hidden md:block bottom-20 right-10 w-48 h-48 text-cyan-400" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5,5" />
    </svg>
    <!-- New Zigzag -->
    <svg class="scribble hidden md:block top-20 right-20 w-24 h-24 text-lime-400" viewBox="0 0 100 100">
        <path d="M10,10 L30,90 L50,10 L70,90 L90,10" fill="none" stroke="currentColor" stroke-width="3" />
    </svg>

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="mb-8 md:mb-12 text-center relative">
            <h1 class="text-4xl md:text-7xl title-font mb-2 tracking-widest text-white neon-title">
                TERMINAL <span class="doodle-font text-pink-500">→</span> TEXT
            </h1>
            <div class="flex items-center justify-center gap-3">
                <span class="text-cyan-400 font-bold tracking-widest text-xs md:text-sm uppercase neon-subtitle">/// TERMINAL OUTPUT CLEANER ///</span>
            </div>
            
            <div class="absolute -right-4 top-0 rotate-12 hidden md:block">
                <div class="bg-yellow-400 text-black font-bold px-3 py-1 border-2 border-black shadow-[4px_4px_0px_rgba(255,255,255,1)]">
                    v 2.0
                </div>
            </div>
        </header>

        <main class="grid grid-cols-1 gap-8 md:gap-12">
            <!-- Input -->
            <div class="relative group">
                <div class="absolute -top-4 left-4 bg-lime-400 text-black px-3 py-0.5 text-xs font-bold border-2 border-black z-10 skew-x-[-10deg] shadow-[2px_2px_0px_#fff]">
                    INPUT_ZONE
                </div>
                <!-- Reduced height on mobile (h-48) vs desktop (h-64) -->
                <div class="neon-border rounded-lg overflow-hidden h-48 md:h-64">
                    <textarea id="input" 
                        class="w-full h-full p-6 text-sm outline-none resize-none custom-scrollbar placeholder-zinc-700"
                        placeholder="PASTE YOUR TERMINAL JUNK HERE...&#10;^[[32m$ npm start^[[0m"></textarea>
                </div>
            </div>

            <!-- Output Control Bar -->
            <div class="flex flex-col gap-4">
                <!-- Stacked controls on mobile, row on desktop -->
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    
                    <div class="flex items-center justify-between md:justify-start gap-4">
                        <div class="doodle-font text-2xl text-lime-400" style="text-shadow: 2px 2px 0px #000;">CLEAN TEXT</div>
                        <label class="flex items-center gap-2 cursor-pointer bg-zinc-900 px-3 py-1 rounded border border-zinc-600 hover:border-pink-500 transition-colors group">
                            <input type="checkbox" id="reflowToggle" checked class="toggle-checkbox appearance-none w-4 h-4 border-2 border-zinc-400 rounded bg-transparent group-hover:border-pink-500">
                            <span class="text-xs font-bold uppercase tracking-wider text-zinc-300 group-hover:text-pink-500 transition-colors">Smart Reflow</span>
                        </label>
                    </div>
                    
                    <!-- Full width button on mobile for easier tapping -->
                    <button id="copyBtn" class="btn-retro w-full md:w-auto px-8 py-3 flex items-center justify-center gap-2 text-sm tracking-widest">
                        <span>COPY TEXT</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                    </button>
                </div>

                <div class="relative">
                    <div class="neon-border rounded-lg overflow-hidden bg-zinc-900 h-48 md:h-64 relative">
                        <!-- Scanline overlay -->
                        <div class="absolute inset-0 pointer-events-none bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.1)_50%),linear-gradient(90deg,rgba(255,0,0,0.03),rgba(0,255,0,0.01),rgba(0,0,255,0.03))] bg-[length:100%_4px,6px_100%] z-10 opacity-50"></div>
                        <pre id="output" class="w-full h-full p-6 text-sm overflow-auto custom-scrollbar whitespace-pre-wrap text-cyan-300 selection:bg-pink-500 selection:text-white relative z-0"></pre>
                    </div>
                </div>
            </div>
        </main>

        <footer class="mt-12 md:mt-16 flex justify-center items-center gap-8 border-t-2 border-zinc-800 pt-8">
            <button id="clearBtn" class="text-xs font-bold text-red-500 hover:text-red-400 hover:tracking-widest transition-all duration-300">
                [ NUKE IT ]
            </button>
            <div class="text-[10px] text-zinc-600 uppercase tracking-widest">Est. 1990</div>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-6 right-6 md:left-auto md:right-10 md:w-auto text-center md:text-left bg-lime-400 text-black px-6 py-3 border-4 border-black font-bold doodle-font translate-y-40 transition-transform duration-300 shadow-[8px_8px_0px_#fff] z-50">
        BOOM! COPIED!
    </div>

    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const toast = document.getElementById('toast');
        const reflowToggle = document.getElementById('reflowToggle');

        // ANSI Escape Code Regex
        const ansiRegex = /[\u001b\u009b][[()#;?]*(?:[0-9]{1,4}(?:;[0-9]{0,4})*)?[0-9A-ORZcf-nqry=><]/g;

        function process() {
            let val = input.value;

            // 1. Strip ANSI
            val = val.replace(ansiRegex, '');

            if (reflowToggle.checked) {
                // 2. Reflow Logic (Unwrap hard-wrapped text)
                const paragraphs = val.split(/\n\s*\n/);
                
                const processedParagraphs = paragraphs.map(p => {
                    let lines = p.split('\n');
                    lines = lines.map(l => l.trim());
                    lines = lines.filter(l => l.length > 0);
                    return lines.join(' ');
                });

                val = processedParagraphs.join('\n\n');
            } else {
                // Classic Logic
                const lines = val.split('\n');
                let minIndent = Infinity;
                let hasContent = false;

                for (const line of lines) {
                    if (line.trim().length === 0) continue;
                    const leadingSpaceCount = line.match(/^\s*/)[0].length;
                    if (leadingSpaceCount < minIndent) minIndent = leadingSpaceCount;
                    hasContent = true;
                }

                if (hasContent && minIndent > 0 && minIndent !== Infinity) {
                    val = lines.map(line => {
                        if (line.trim().length === 0) return '';
                        return line.substring(minIndent);
                    }).join('\n');
                }
            }

            // 3. Final Trim
            val = val.trim();

            // 4. Update Output
            output.textContent = val;
        }

        function copy() {
            const text = output.textContent;
            if (!text) return;

            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            toast.classList.remove('translate-y-40');
            setTimeout(() => {
                toast.classList.add('translate-y-40');
            }, 2000);
        }

        input.addEventListener('input', process);
        reflowToggle.addEventListener('change', process);
        
        copyBtn.addEventListener('click', copy);
        clearBtn.addEventListener('click', () => {
            input.value = '';
            output.textContent = '';
            input.focus();
        });

        window.onload = () => input.focus();
    </script>
</body>
</html>
